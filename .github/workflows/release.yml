name: Release

# Publishes guardagent to npm for a release tag. Nothing is linted or tested
# here: the tagged commit must already have passed the push workflows listed
# in REQUIRED_WORKFLOWS (ci.yml runs the typecheck, the build, the node 20/22
# tests with Redis and the tarball pack smoke). A release can therefore never
# fail on a check its pull request did not run.
#
# Re-drive: run this workflow by hand (Actions > Release > Run workflow) with
# the tag, for example v3.2.4. It checks out that tag, so a fixed workflow on
# master can publish an existing tag. A version already on npm is skipped.

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v3.2.4'
        required: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  REQUIRED_WORKFLOWS: >-
    .github/workflows/ci.yml
jobs:
  verify:
    name: Tagged commit passed CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${INPUT_TAG:-$RELEASE_TAG}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$tag' is not of the form v1.2.3"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Verify the tag equals the package version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version=$(jq -r .version package.json)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::tag $TAG does not match guardagent version $version"
            exit 1
          fi
          echo "ok: $TAG matches guardagent $version"

      # The newest push run of each required workflow on the tagged commit
      # must have succeeded. A release created right after a merge waits for
      # them (up to an hour) instead of failing.
      - name: Require green CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          for _ in $(seq 1 60); do
            runs=$(gh api "repos/$REPO/actions/runs?head_sha=$sha&event=push&per_page=100" \
              --jq '[.workflow_runs | group_by(.path)[] | max_by(.run_number) | {path, status, conclusion}]')
            waiting=0
            for wf in $REQUIRED_WORKFLOWS; do
              run=$(jq -c --arg p "$wf" '.[] | select(.path == $p)' <<< "$runs")
              if [ -z "$run" ]; then
                echo "$wf: no push run on $sha yet"; waiting=1; continue
              fi
              status=$(jq -r .status <<< "$run"); conclusion=$(jq -r .conclusion <<< "$run")
              if [ "$status" != "completed" ]; then
                echo "$wf: $status"; waiting=1
              elif [ "$conclusion" != "success" ]; then
                echo "::error::$wf concluded $conclusion on $sha; fix master and release a new tag"
                exit 1
              else
                echo "ok: $wf success on $sha"
              fi
            done
            [ "$waiting" = "0" ] && exit 0
            sleep 60
          done
          echo "::error::required workflows did not finish on $sha within an hour"
          exit 1

  publish:
    name: Publish guardagent to npm (trusted publishing)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (ESM + CJS + types)
        run: pnpm build

      # The registry rejects a duplicate version, so a version already on npm
      # is skipped and a re-drive after a partial failure is safe.
      - name: Publish
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          version="${TAG#v}"
          if npm view "guardagent@$version" version > /dev/null 2>&1; then
            echo "guardagent $version is already on npm; skipping"
            exit 0
          fi
          npm publish --access public --provenance

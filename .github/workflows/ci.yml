name: CI

on:
  # No paths filter on push: release.yml requires a push run of this workflow on
  # the tagged commit, and a docs-only commit (a changelog fix) must still get one.
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:coverage
        env:
          REDIS_URL: redis://localhost:6379
      - name: Assert the coverage run produced its report (100% gate lives in vitest.config.ts)
        run: test -f coverage/coverage-summary.json

  # Moved here from the release workflow, which no longer runs anything at the
  # tag: the packed tarball must install and import in a scratch project.
  pack-smoke:
    name: Tarball consumable
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Build and pack guardagent
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p /tmp/pack
          pnpm pack --pack-destination /tmp/pack

      - name: Install the tarball into a scratch project and exercise the API
        run: |
          set -euo pipefail
          mkdir -p /tmp/scratch
          cd /tmp/scratch
          printf '{"name":"release-gate-scratch","private":true,"type":"module"}\n' > package.json
          pnpm add /tmp/pack/guardagent-*.tgz
          node --input-type=module -e "
            import { GuardAgent, KNOWN_EVENT_TYPES, METRIC_TYPES } from 'guardagent';
            if (typeof GuardAgent !== 'function') throw new Error('GuardAgent missing');
            if (KNOWN_EVENT_TYPES.length === 0 || METRIC_TYPES.length === 0) throw new Error('model constants missing');
            console.log('pack smoke ok: guardagent imports from the packed tarball');
          "
